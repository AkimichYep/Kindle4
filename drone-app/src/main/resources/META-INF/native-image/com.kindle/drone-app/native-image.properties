# GraalVM Native Image build configuration for kindle-drone-tools
#
# Target platform: ARM Linux (Amazon Kindle 4 Wi-Fi, ARMv6/ARMv7)
# Build platform:  x86_64 Linux (cross-compile with --target option)
#
# Usage:
#   mvn -Pnative package
#   # or directly:
#   native-image -cp drone-app-2.0.0-SNAPSHOT.jar \
#       com.yep.kindle.dron.KindleDroneDetectorPro \
#       drone-detector
#
# Key decisions
# ─────────────────────────────────────────────────────────────────────────────
# --no-fallback
#   Fail fast if any class cannot be resolved at build time.
#   We have no framework magic (no Spring, no reflection-heavy libs),
#   so this is achievable and makes the binary fully self-contained.
#
# --initialize-at-build-time
#   Pure-utility classes with static state that is safe to initialise once
#   at build time (no file-system access, no network, no mutable globals
#   that change at run time).
#
# --initialize-at-run-time
#   Classes that read hardware at class-load time (SensorReader, WifiScanner,
#   AppLog) must defer initialisation until the process actually runs on the
#   Kindle hardware.
#
# -H:+ReportExceptionStackTraces
#   Surface full stack traces for native exceptions — helpful during bring-up.
#
# -H:+AllowVMInspection
#   Allow JVM inspection signals (SIGUSR1 heap dump) even in native mode.
#
# --enable-url-protocols=http,https
#   Required for KindleHttpClient and WeatherService (Open-Meteo, wttr.in,
#   NOAA SWPC URLs, Open-Meteo geocode API).
#
# -H:IncludeResources
#   Embed the weather icon font TTF and any PNG assets on the classpath.
#
# Notes on AWT / headless mode
# ─────────────────────────────────────────────────────────────────────────────
# The application sets java.awt.headless=true at startup and uses only
# BufferedImage / Graphics2D / ImageIO — the headless AWT pipeline.
# GraalVM CE ≥ 22 supports headless AWT out of the box.
# GraalVM CE < 22 requires -H:+EnableAllSecurityServices and the
# libfontmanager native library.  On older builds add:
#   Args = --features=org.graalvm.home.HomeFinderFeature

Args = \
  --no-fallback \
  --verbose \
  -H:+ReportExceptionStackTraces \
  -H:+AllowVMInspection \
  --enable-url-protocols=http,https \
  --initialize-at-build-time=\
com.yep.kindle.dron.detection.DroneSignatures,\
com.yep.kindle.dron.detection.MovementMetrics,\
com.yep.kindle.dron.display.KindleFormatUtils,\
com.yep.kindle.dron.display.KindleLayoutKit,\
com.yep.kindle.dron.event.EventBus,\
com.yep.kindle.dron.event.AppEvent,\
com.yep.kindle.dron.event.AppEvent$Type,\
com.yep.kindle.dron.util.WifiUtils \
  --initialize-at-run-time=\
com.yep.kindle.dron.util.AppLog,\
com.yep.kindle.dron.util.SensorReader,\
com.yep.kindle.dron.util.KindleUtils,\
com.yep.kindle.dron.service.WifiScanner,\
com.yep.kindle.dron.service.WeatherService,\
com.yep.kindle.dron.service.NetCsvStore,\
com.yep.kindle.dron.display.DisplayManager,\
com.yep.kindle.dron.display.RadarImageManager,\
com.yep.kindle.dron.display.RadarRenderer,\
com.yep.kindle.dron.display.ScreenBuilder,\
com.yep.kindle.dron.display.WeatherIconFont,\
com.yep.kindle.dron.web.KindleWebServer,\
com.yep.kindle.dron.web.DeviceState,\
com.yep.kindle.dron.web.AppDataManager,\
com.yep.kindle.dron.web.WebHandlers,\
com.yep.kindle.dron.tool.KindleTcpListener,\
com.yep.kindle.dron.event.ScanScheduler,\
com.yep.kindle.dron.KindleDroneDetectorPro,\
com.yep.kindle.dron.KindleHomeTemp,\
com.yep.kindle.dron.KindleMoonCalendarNoKey,\
com.yep.kindle.dron.KindleSpaceWeatherNoKey,\
com.yep.kindle.dron.KindleWeatherNoKey,\
com.yep.kindle.dron.KindleWelcomePage \
  -H:IncludeResources=font/.*\.ttf \
  -H:IncludeResources=font/.*\.woff2? \
  -H:Name=drone-detector
